name: "Actualizar listas IPTV"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      portal_id:
        description: "ID del portal a procesar (vacio = todos)"
        required: false
        default: ""
      verbose:
        description: "Modo verbose"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-lists:
    name: "Extraer y actualizar listas Xtream"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "Checkout repositorio"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: "Configurar Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Instalar dependencias"
        run: pip install -r requirements.txt

      - name: "Preparar directorios"
        run: |
          mkdir -p data/series_info
          mkdir -p logs

      - name: "Aplicar configuracion de secrets"
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_MAC: ${{ secrets.PORTAL_MAC }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ -n "$PORTAL_URL" ] && [ -n "$PORTAL_MAC" ]; then
            python3 - <<'PYEOF'
          import json, os
          config_path = "config/portals.json"
          with open(config_path, "r") as f:
              config = json.load(f)
          portal_url = os.environ.get("PORTAL_URL", "")
          portal_mac = os.environ.get("PORTAL_MAC", "")
          worker_url = os.environ.get("WORKER_URL", "https://antigmac.workers.dev")
          if portal_url and portal_mac:
              config["portals"][0]["url"] = portal_url
              config["portals"][0]["mac"] = portal_mac
          with open(config_path, "w") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
          with open(".worker_url", "w") as f:
              f.write(worker_url)
          PYEOF
          else
            WORKER_URL="${WORKER_URL:-https://antigmac.workers.dev}"
            echo "$WORKER_URL" > .worker_url
          fi

      - name: "Ejecutar MacToXtream extractor"
        env:
          PYTHONPATH: ${{ github.workspace }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          WORKER_URL=$(cat .worker_url 2>/dev/null || echo "https://antigmac.workers.dev")
          PORTAL_ARG=""
          VERBOSE_ARG=""
          if [ -n "${{ github.event.inputs.portal_id }}" ]; then
            PORTAL_ARG="--portal ${{ github.event.inputs.portal_id }}"
          fi
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            VERBOSE_ARG="-v"
          fi
          python extractor/main.py \
            --config config/portals.json \
            --data-dir data \
            --worker-url "$WORKER_URL" \
            $PORTAL_ARG \
            $VERBOSE_ARG

      - name: "Verificar archivos generados"
        run: |
          echo "Archivos generados:"
          ls -la data/ 2>/dev/null || echo "No hay datos aun"

      - name: "Commit y push de datos"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No hay cambios en los datos."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Auto-update listas IPTV [${TIMESTAMP}] [skip ci]"
            git push
            echo "Datos actualizados correctamente"
          fi

      - name: "Resumen del job"
        if: always()
        run: |
          echo "### Resumen MacToXtream" >> $GITHUB_STEP_SUMMARY
          echo "Ejecutado: $(date -u)" >> $GITHUB_STEP_SUMMARY
