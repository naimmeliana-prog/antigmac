name: Generate Xtream Playlists

on:
  schedule:
    - cron: '0 */6 * * *' # cada 6 horas
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    env:
      PORTAL_URL: ${{ secrets.PORTAL_URL }}
      PORTAL_MAC: ${{ secrets.PORTAL_MAC }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy config from secrets
        run: |
          echo "portal_url: $PORTAL_URL" > config.yaml
          echo "mac: $PORTAL_MAC" >> config.yaml
          echo "filters:\n  languages:\n    es_es: true\n    fr_fr: true\n    en_gb: true" >> config.yaml

      - name: Run generator
        run: |
          python generate.py --config config.yaml --outdir generated

      - name: Commit and push generated to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # create orphan gh-pages branch and copy generated files to root
          git checkout --orphan gh-pages
          git rm -rf . || true
          mkdir -p generated
          cp -r generated/* . || true
          git add -A
          git commit -m "Update generated playlists from workflow" || echo "No changes to commit"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Cloudflare Worker
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: |
          npm install -g wrangler
          # create a minimal wrangler.toml using the account id from env
          mkdir -p cloudflare_worker
          echo 'name = "mactoxtream-worker"' > cloudflare_worker/wrangler.toml
          echo 'main = "index.js"' >> cloudflare_worker/wrangler.toml
          echo "account_id = \"$CF_ACCOUNT_ID\"" >> cloudflare_worker/wrangler.toml
          cd cloudflare_worker
          npx wrangler publish
