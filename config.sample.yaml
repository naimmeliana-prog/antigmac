# Sample configuration for MacToXtreamAntig
portal_url: "http://mag.greatott.me:80/c/"
mac: "00:1A:79:74:B1:B9"

filters:
  # languages to include. keys: es_es (Spanish Spain), fr_fr (French France), en_gb (English UK)
  # Set allow_all to true to skip language filtering
  languages:
    allow_all: false
    es_es: true
    fr_fr: true
    en_gb: true
    # Optional: custom token lists to refine detection
    tokens:
      es_es:
        - espa
        - espana
        - espaol
      es_es_exclude:
        - latino
        - latam
      fr_fr:
        - france
        - francais
      en_gb:
        - uk
        - england

# categories toggles
categories:
  live: true
  movies: true
  series: true
